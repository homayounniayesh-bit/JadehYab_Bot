services:
  - type: web
    name: roadradar-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SEARCH_TIMEOUT
        value: "12"
      - key: MAX_RESULTS
        value: "8"
